name: Feature / detection rule request
description: Propose a capability, detection rule, or integration for Signetry.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Signetry is [open core](https://github.com/Signetry/signetry/blob/main/LICENSING.md):
        the integrations are Apache-2.0, the kernel is BUSL-1.1 until 2030-08-31.
        Contributions are accepted under the CLA and credited.
  - type: input
    id: component
    attributes:
      label: Component / repo
      placeholder: "core · action · reviewer · eval · a plugin"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today, or what should Signetry detect/govern that it doesn't?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen? For a detection rule, include the CWE, a vulnerable example, and a safe example that must NOT be flagged.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to open a PR for this (I'll sign the CLA on my first PR).
